<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการคำสั่งซื้อ & พิมพ์ใบปะหน้าพัสดุ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800">

  <header class="bg-slate-900 text-white py-4 px-6 flex justify-between items-center">
    <h1 class="text-xl font-bold">📦 ระบบหลังบ้าน: หยิบสินค้า & จ่าหน้าพัสดุ</h1>
    <div class="space-x-3">
      <button onclick="fetchOrders()" class="bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded text-sm">🔄 รีเฟรชข้อมูล</button>
      <a href="index.html" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-sm">← กลับหน้าร้าน</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6">
    <div id="loading" class="text-center py-10 text-slate-500">กำลังโหลดข้อมูลคำสั่งซื้อจาก Google Sheets...</div>
    
    <div id="orders-container" class="grid gap-4"></div>
  </main>

  <div id="print-area" class="hidden"></div>

  <script>
    // ⚠️ นำ Web App URL เดียวกันมาวางที่นี่
    const SCRIPT_URL = "วาง_WEB_APP_URL_ของคุณที่นี่";
    let allOrders = [];

    async function fetchOrders() {
      document.getElementById("loading").classList.remove("hidden");
      try {
        const res = await fetch(SCRIPT_URL);
        allOrders = await res.json();
        renderOrders();
      } catch (err) {
        alert("ไม่สามารถดึงข้อมูลได้ ตรวจสอบ URL ของ Apps Script");
      } finally {
        document.getElementById("loading").classList.add("hidden");
      }
    }

    function renderOrders() {
      const container = document.getElementById("orders-container");
      container.innerHTML = "";

      if (allOrders.length === 0) {
        container.innerHTML = "<p class='text-center text-slate-500'>ยังไม่มีคำสั่งซื้อ</p>";
        return;
      }

      allOrders.forEach((order, index) => {
        const isPacked = order.status.includes("แพ็คแล้ว");
        const badgeColor = isPacked ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-800";

        container.innerHTML += `
          <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="space-y-1">
              <div class="flex items-center gap-3">
                <span class="font-bold text-lg text-slate-900">${order.orderId}</span>
                <span class="text-xs px-2.5 py-0.5 rounded-full font-semibold ${badgeColor}">${order.status}</span>
                <span class="text-xs text-slate-400">${order.timestamp}</span>
              </div>
              <p class="text-sm"><strong>ลูกค้า:</strong> ${order.name} (${order.phone})</p>
              <p class="text-sm text-slate-600"><strong>ที่อยู่:</strong> ${order.address}</p>
              <div class="mt-2 bg-slate-50 p-2.5 rounded border border-slate-200 text-sm font-medium text-blue-900">
                🛒 รายการหยิบสินค้า (Pick List): ${order.items} <span class="text-slate-500">(ยอดรวม ฿${order.total})</span>
              </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
              ${!isPacked ? `
                <button onclick="markAsPacked('${order.orderId}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
                  ✅ หยิบและแพ็คเรียบร้อย
                </button>
              ` : ''}
              <button onclick="printLabel(${index})" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium">
                🖨️ พิมพ์ใบปะหน้าพัสดุ
              </button>
            </div>
          </div>
        `;
      });
    }

    async function markAsPacked(orderId) {
      if (!confirm(`ยืนยันการหยิบและแพ็คสินค้าสำหรับ ${orderId} ใช่หรือไม่?`)) return;
      
      await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "updateStatus",
          orderId: orderId,
          status: "แพ็คแล้ว / พร้อมส่ง (Packed)"
        })
      });
      fetchOrders();
    }

    function printLabel(index) {
      const order = allOrders[index];
      const printArea = document.getElementById("print-area");
      printArea.classList.remove("hidden");

      printArea.innerHTML = `
        <div style="border: 2px solid #000; padding: 20px; width: 400px; margin: 0 auto; font-family: 'Prompt', sans-serif;">
          <div style="border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 10px; display: flex; justify-content: space-between;">
            <strong>CHOCO CRAFT SHOP</strong>
            <span>Order: <strong>${order.orderId}</strong></span>
          </div>
          <div style="font-size: 12px; margin-bottom: 15px;">
            <strong>ผู้ส่ง:</strong> ร้าน CHOCO CRAFT (โทร. 02-000-0000)<br>
            123 ถนนสุขุมวิท กรุงเทพฯ 10110
          </div>
          <div style="border: 1px solid #000; padding: 12px; margin-bottom: 15px; background: #f9f9f9;">
            <div style="font-size: 14px; font-weight: bold; margin-bottom: 4px;">ผู้รับ (TO): ${order.name}</div>
            <div style="font-size: 14px; margin-bottom: 4px;">โทร: ${order.phone}</div>
            <div style="font-size: 14px;">ที่อยู่: ${order.address}</div>
          </div>
          <div style="font-size: 12px; border-top: 1px dashed #000; padding-top: 8px;">
            <strong>รายการสินค้าในกล่อง (Packing Slip):</strong><br>
            ${order.items}
          </div>
        </div>
      `;

      window.print();
      printArea.classList.add("hidden");
    }

    fetchOrders();
  </script>
</body>
</html>
